server:
  port: 8080

spring:
  application:
    name: FoodCost

  r2dbc:
    url: ${DATABASE_URL}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI}
          jwk-set-uri: ${JWT_JWK_SET_URI}

api:
  food-service-url: ${FOOD_SERVICE_URL}
  hens-service-url: ${HENS_SERVICE_URL}
  
